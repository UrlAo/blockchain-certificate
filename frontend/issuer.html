<body>
    <div class="container">
      <div class="header">
        <div class="title">🎓 发行证书</div>
        <div class="status">
          <button class="link-btn" onclick="location.href='index.html'">返回首页</button>
          <button id="connectBtn" class="btn-primary" onclick="connectWallet()">连接钱包</button>
          <span id="walletBadge" class="badge" style="display:none"></span>
        </div>
      </div>
      <div class="card" id="hashCard">
        <h3>步骤 1：选择证书文件并计算哈希</h3>
        <div id="dropZone" class="uploader">拖拽文件到此或点击下方选择</div>
        <div class="form-group">
          <input type="file" id="certFile" accept=".pdf,.jpg,.jpeg,.png" >
        </div>
        <div class="row">
          <button id="calcBtn" class="btn-secondary" onclick="calculateHash()" disabled>计算文件哈希</button>
        </div>
        <div id="hashResult"></div>
      </div>
      <div class="card">
        <h3>步骤 2：填写证书信息</h3>
        <div class="grid">
          <div class="field"><label for="studentId">学号</label><input class="input" type="text" id="studentId" placeholder="例如: 202301001"></div>
          <div class="field"><label for="studentName">学生姓名</label><input class="input" type="text" id="studentName" placeholder="例如: 张三"></div>
        </div>
        <div class="field"><label for="degree">学位信息</label><input class="input" type="text" id="degree" placeholder="例如: 计算机科学学士"></div>
        <div class="field"><label for="cid">IPFS CID（可选）</label><input class="input" type="text" id="cid" placeholder="例如: bafy..."></div>
      </div>
      <div class="card" id="issueCard">
        <h3>步骤 3：发行到区块链</h3>
        <div class="row">
          <button id="issueBtn" class="btn-primary" onclick="issueCertificate()" disabled>发行证书到区块链</button>
          <button id="revokeBtn" class="btn-secondary" onclick="revokeCurrentCertificate()">撤销当前证书</button>
          <button id="sigBtn" class="btn-secondary" onclick="issueWithSignature()">签名发行</button>
        </div>
        <div id="status" class="hint"></div>
      </div>
    </div>

        // 初始化以太坊连接
        async function initEthereum() {
            if (typeof window.ethereum !== 'undefined') {
                const currentChain = await window.ethereum.request({ method: 'eth_chainId' });
                if (currentChain !== LOCAL_CHAIN_ID_HEX) {
                    try {
                        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: LOCAL_CHAIN_ID_HEX }] });
                    } catch (e) {
                        if (e && e.code === 4902) {
                            await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: LOCAL_CHAIN_ID_HEX, chainName: 'Hardhat Local', rpcUrls: [LOCAL_RPC_URL], nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 } }] });
                        }
                    }
                }
                provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send('eth_requestAccounts', []);
                signer = provider.getSigner();
                await loadAbiIfNeeded();
                const abiToUse = window.contractABI || contractABI;
                const addrToUse = ((typeof CONFIG !== 'undefined' && CONFIG.CONTRACT_ADDRESS) ? CONFIG.CONTRACT_ADDRESS : contractAddress).trim();
                const code = await provider.getCode(addrToUse);
                if (!code || code === '0x') {
                    const fallback = contractAddress.trim();
                    const code2 = await provider.getCode(fallback);
                    if (code2 && code2 !== '0x') {
                        contract = new ethers.Contract(fallback, abiToUse, signer);
                    } else {
                        throw new Error('合约地址无效或未部署，请运行本地节点并重新部署合约');
                    }
                } else {
                    contract = new ethers.Contract(addrToUse, abiToUse, signer);
                }
                console.log("以太坊连接初始化成功");
                updateIssueBtnState();
                updateCalcBtnState();
                try {
                    const network = await provider.getNetwork();
                    const addr = await signer.getAddress();
                    currentAccount = addr;
                    const badge = document.getElementById('walletBadge');
                    badge.style.display = 'inline-block';
                    badge.innerText = `已连接: ${addr.slice(0,6)}...${addr.slice(-4)} | chainId: ${network.chainId}`;
                    await showAccountDetails();
                } catch (_) {}
            } else {
                alert('请安装MetaMask!');
            }
        }

        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') { alert('请安装MetaMask!'); return; }
            const currentChain = await window.ethereum.request({ method: 'eth_chainId' });
            if (currentChain !== LOCAL_CHAIN_ID_HEX) {
                try {
                    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: LOCAL_CHAIN_ID_HEX }] });
                } catch (e) {
                    if (e && e.code === 4902) {
                        await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: LOCAL_CHAIN_ID_HEX, chainName: 'Hardhat Local', rpcUrls: [LOCAL_RPC_URL], nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 } }] });
                    }
                }
            }
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send('eth_requestAccounts', []);
            signer = provider.getSigner();
            await loadAbiIfNeeded();
            const abiToUse = window.contractABI || contractABI;
            const addrToUse = ((typeof CONFIG !== 'undefined' && CONFIG.CONTRACT_ADDRESS) ? CONFIG.CONTRACT_ADDRESS : contractAddress).trim();
            const code = await provider.getCode(addrToUse);
            if (!code || code === '0x') {
                const fallback = contractAddress.trim();
                const code2 = await provider.getCode(fallback);
                if (code2 && code2 !== '0x') {
                    contract = new ethers.Contract(fallback, abiToUse, signer);
                } else {
                    throw new Error('合约地址无效或未部署，请运行本地节点并重新部署合约');
                }
            } else {
                contract = new ethers.Contract(addrToUse, abiToUse, signer);
            }
            try {
                const network = await provider.getNetwork();
                const addr = await signer.getAddress();
                currentAccount = addr;
                const badge = document.getElementById('walletBadge');
                badge.style.display = 'inline-block';
                badge.innerText = `已连接: ${addr.slice(0,6)}...${addr.slice(-4)} | chainId: ${network.chainId}`;
                await showAccountDetails();
            } catch (_) {}
            updateIssueBtnState();
        }

        // 计算文件哈希
        async function calculateHash() {
            const fileInput = document.getElementById('certFile');
            if (!fileInput.files[0]) {
                alert('请选择文件');
                return;
            }

            const file = fileInput.files[0];
            const arrayBuffer = await file.arrayBuffer();
            
            // 计算SHA-256哈希
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            currentFileHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            document.getElementById('hashResult').innerHTML = 
                `<div class="card"><div class="row"><strong>文件哈希值</strong><button class="btn-secondary" onclick="copyText('${currentFileHash}')">复制</button></div><div class="code">${currentFileHash}</div></div>`;
            updateIssueBtnState();
            updateCalcBtnState();
        }


        function updateCalcBtnState(){
            console.log('updateCalcBtnState called');
            const fileInput = document.getElementById('certFile');
            const calcBtn = document.getElementById('calcBtn');
            const hashCard = document.getElementById('hashCard');
            const hasFile = !!(fileInput && ((fileInput.files && fileInput.files.length > 0) || (fileInput.value && fileInput.value.trim().length > 0)));
            console.log('File Input:', fileInput);
            console.log('Has File:', hasFile, 'Files Length:', fileInput?.files?.length, 'Input Value:', fileInput?.value);
            if (!calcBtn) return;
            if (hasFile) {
                console.log('Enabling button');
                calcBtn.disabled = false;
                calcBtn.removeAttribute('disabled');
                calcBtn.classList.add('enabled');
                if (hashCard) { hashCard.classList.add('enabled'); hashCard.classList.remove('disabled'); }
            } else {
                console.log('Disabling button');
                calcBtn.disabled = true;
                calcBtn.setAttribute('disabled', 'disabled');
                calcBtn.classList.remove('enabled');
                if (hashCard) { hashCard.classList.remove('enabled'); hashCard.classList.add('disabled'); }
            }
        }

        // 发行证书

        async function issueCertificate() {
            if (!contract) {
                alert('请先连接钱包');
                return;
            }
            if (!currentFileHash) {
                alert('请先计算文件哈希');
                return;
            }

            const studentId = document.getElementById('studentId').value;
            const studentName = document.getElementById('studentName').value;
            const degree = document.getElementById('degree').value;

            if (!studentId || !studentName || !degree) {
                alert('请填写所有信息');
                return;
            }

            try {
                const hashBytes32 = '0x' + currentFileHash;
                const existing = await contract.getCertificate(hashBytes32);
                if (existing && existing[0] && !existing[5]) {
                    const issuedAt = new Date(Number(existing[4]) * 1000).toLocaleString();
                    document.getElementById('status').innerHTML = `<div class="card warn">证书已存在且未撤销，无法重复发行<br>学号: ${existing[1]} | 姓名: ${existing[2]} | 学位: ${existing[3]} | 时间: ${issuedAt}</div>`;
                    return;
                }
                if (existing && existing[0] && existing[5]) {
                    const revokeAt = new Date(Number(existing[7]) * 1000).toLocaleString();
                    document.getElementById('status').innerHTML = `<div class="card info">该证书此前已撤销（${revokeAt}），将执行重新发行</div>`;
                }

                document.getElementById('status').innerHTML = '<div class="card info">正在发行证书...</div>';
                document.getElementById('issueBtn').disabled = true;

                const cid = document.getElementById('cid').value.trim();
                let tx;
                if (cid && typeof contract.issueCertificateWithCid === 'function') {
                  tx = await contract.issueCertificateWithCid(hashBytes32, studentId, studentName, degree, cid);
                } else {
                  tx = await contract.issueCertificate(hashBytes32, studentId, studentName, degree);
                }
                document.getElementById('status').innerHTML = `<div class="card info">交易已提交，等待确认<br>txHash: <span class="code">${tx.hash}</span> <button class="btn-secondary" onclick="copyText('${tx.hash}')">复制</button></div>`;

                await tx.wait();
                document.getElementById('status').innerHTML = '<div class="card success">✅ 证书发行成功！</div>';
                document.getElementById('issueBtn').disabled = false;

            } catch (error) {
                document.getElementById('status').innerHTML = `<div class="card error">❌ 发行失败: ${error.message}</div>`;
                document.getElementById('issueBtn').disabled = false;
            }
        }

        function updateIssueBtnState() {
            const canIssue = Boolean(currentFileHash) && Boolean(contract);
            const studentId = document.getElementById('studentId').value.trim();
            const studentName = document.getElementById('studentName').value.trim();
            const degree = document.getElementById('degree').value.trim();
            const canRevoke = Boolean(currentFileHash) && Boolean(contract);
            const canSig = Boolean(currentFileHash) && Boolean(contract) && Boolean(studentId) && Boolean(studentName) && Boolean(degree);

            const issueBtn = document.getElementById('issueBtn');
            const revokeBtn = document.getElementById('revokeBtn');
            const sigBtn = document.getElementById('sigBtn');
            const issueCard = document.getElementById('issueCard');

            issueBtn.disabled = !canIssue;
            revokeBtn.disabled = !canRevoke;
            sigBtn.disabled = !canSig;

            issueBtn.classList.toggle('enabled', canIssue);
            revokeBtn.classList.toggle('enabled', canRevoke);
            sigBtn.classList.toggle('enabled', canSig);

            const anyEnabled = canIssue || canRevoke || canSig;
            issueCard.classList.toggle('enabled', anyEnabled);
            issueCard.classList.toggle('disabled', !anyEnabled);
        }

        async function showAccountDetails(){
            try{
                const bal = await provider.getBalance(currentAccount);
                const adminAddr = await contract.admin();
                const isAdmin = adminAddr.toLowerCase() === currentAccount.toLowerCase();
                const status = document.getElementById('status');
                status.innerHTML = `<div class="card info">余额: ${Number(ethers.utils.formatEther(bal)).toFixed(4)} ETH | 权限: ${isAdmin? '管理员':'非管理员'}${isAdmin? '':'（仅管理员可发行）'}</div>`;
            }catch(_){}
        }

        ['studentId','studentName','degree'].forEach(id=> {
          const el = document.getElementById(id);
          if (el) el.addEventListener('input', updateIssueBtnState)
        })

        function copyText(text){
            navigator.clipboard.writeText(text).catch(()=>{});
        }

        const dropZone = document.getElementById('dropZone');
        if(dropZone){
          ['dragenter','dragover'].forEach(evt=>dropZone.addEventListener(evt,e=>{e.preventDefault();dropZone.classList.add('drag')}));
          ['dragleave','drop'].forEach(evt=>dropZone.addEventListener(evt,e=>{e.preventDefault();dropZone.classList.remove('drag')}));
          dropZone.addEventListener('drop', async (e)=> {
              const f = e.dataTransfer.files && e.dataTransfer.files[0];
              if(!f) return;
              document.getElementById('certFile').files = e.dataTransfer.files;
              updateCalcBtnState();
              await calculateHash();
          });
        }

        const cf = document.getElementById('certFile');
        if (cf) {
          cf.addEventListener('change', updateCalcBtnState);
          cf.addEventListener('input', updateCalcBtnState);
        }
        updateCalcBtnState();

        // 撤销证书（管理员）
        async function revokeCurrentCertificate(){
            if (!contract) { alert('请先连接钱包'); return; }
            if (!currentFileHash) { alert('请先计算文件哈希'); return; }
            const reason = prompt('请输入撤销原因');
            if (reason === null) return;
            try{
                document.getElementById('status').innerHTML = '<div class="card warn">正在撤销证书...</div>';
                const hashBytes32 = '0x' + currentFileHash;
                const tx = await contract.revokeCertificate(hashBytes32, reason);
                await tx.wait();
                document.getElementById('status').innerHTML = '<div class="card success">已撤销证书</div>';
            }catch(e){
                document.getElementById('status').innerHTML = `<div class="card error">撤销失败: ${e.message}</div>`;
            }
        }

        async function issueWithSignature(){
            if (!contract) { alert('请先连接钱包'); return; }
            if (!currentFileHash) { alert('请先计算文件哈希'); return; }
            const studentId = document.getElementById('studentId').value;
            const studentName = document.getElementById('studentName').value;
            const degree = document.getElementById('degree').value;
            const cid = document.getElementById('cid').value.trim();
            if (!studentId || !studentName || !degree) { alert('请填写所有信息'); return; }
            try{
                const hashBytes32 = '0x' + currentFileHash;
                const existing = await contract.getCertificate(hashBytes32);
                if (existing && existing[0] && !existing[5]){
                    const issuedAt = new Date(Number(existing[4]) * 1000).toLocaleString();
                    document.getElementById('status').innerHTML = `<div class="card warn">证书已存在且未撤销，无法签名重复发行<br>学号: ${existing[1]} | 姓名: ${existing[2]} | 学位: ${existing[3]} | 时间: ${issuedAt}</div>`;
                    return;
                }
                if (existing && existing[0] && existing[5]) {
                    const revokeAt = new Date(Number(existing[7]) * 1000).toLocaleString();
                    document.getElementById('status').innerHTML = `<div class="card info">该证书此前已撤销（${revokeAt}），将执行签名重新发行</div>`;
                }
                const addr = await signer.getAddress();
                const nonce = await contract.nonces(addr);
                const types = {
                    Certificate: [
                        { name: 'certHash', type: 'bytes32' },
                        { name: 'studentId', type: 'string' },
                        { name: 'studentName', type: 'string' },
                        { name: 'degree', type: 'string' },
                        { name: 'ipfsCid', type: 'string' },
                        { name: 'nonce', type: 'uint256' }
                    ]
                };
                const value = {
                    certHash: hashBytes32,
                    studentId,
                    studentName,
                    degree,
                    ipfsCid: cid,
                    nonce: Number(nonce)
                };
                const domain = {
                    name: 'CertificateRegistry',
                    version: '1',
                    chainId: (await provider.getNetwork()).chainId,
                    verifyingContract: contract.address
                };
                const sig = await signer._signTypedData(domain, types, value);
                document.getElementById('status').innerHTML = '<div class="card info">签名完成，提交交易...</div>';
                const tx = await contract.issueWithSig(value.certHash, studentId, studentName, degree, cid, Number(nonce), sig);
                await tx.wait();
                document.getElementById('status').innerHTML = '<div class="card success">签名发行成功</div>';
            }catch(e){
                document.getElementById('status').innerHTML = `<div class="card error">签名发行失败: ${e.message}</div>`;
            }
        }

        async function loadAbiIfNeeded() {
            try {
                if (!window.contractABI && typeof CONFIG !== 'undefined' && CONFIG.ABI_URL) {
                    const res = await fetch(CONFIG.ABI_URL);
                    window.contractABI = await res.json();
                }
            } catch (e) {
                console.warn('加载 ABI 失败，使用内置 ABI', e);
            }
        }

        // 页面加载时初始化
        window.onload = initEthereum;
    </script>
</body>
</html>
